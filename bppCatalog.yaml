openapi: 3.0.3
info:
  title: BPP Catalog Service APIs
  description: >-
    API specification for the BPP Catalog Service that manages JSON
    transformation templates 

    for the BECKN DSEP protocol. This service provides CRUD operations for
    managing templates 

    that transform data between internal format and BECKN DSEP protocol format.
  version: 1.0.0
  contact:
    name: BPP Catalog Service Team
    email: team@example.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:3000
    description: Local Development
  - url: https://api.staging.example.com
    description: Staging Environment
  - url: https://api.example.com
    description: Production Environment
tags:
  - name: Templates
    description: Operations for managing JSON transformation templates
  - name: Session
    description: Mentoring session related APIs
    externalDocs:
      description: ''
      url: ''
components:
  schemas:
    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the template
          readOnly: true
        code:
          type: string
          description: Unique code identifier for the template
          example: mentorTemplate
          minLength: 3
          maxLength: 50
        name:
          type: string
          description: Display name for the template
          example: Mentor Profile Template
        description:
          type: string
          description: Detailed description of the template's purpose
          example: Transforms internal mentor data to BECKN DSEP format
        template_object:
          type: object
          description: JSON transformation template object
        version:
          type: string
          description: Version number of the template
          example: 1.0.0
          pattern: ^\d+\.\d+\.\d+$
        is_active:
          type: boolean
          description: Whether the template is currently active
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - code
        - template_object
        - version
    Error:
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  parameters:
    templateId:
      name: id
      in: path
      description: Template UUID
      required: true
      schema:
        type: string
        format: uuid
paths:
  /api/templates:
    get:
      tags:
        - Templates
      summary: List Templates
      description: Retrieve a paginated list of templates
      operationId: listTemplates
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: is_active
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - name: code
          in: query
          description: Filter by template code
          schema:
            type: string
        - name: version
          in: query
          description: Filter by version
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Template'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      pages:
                        type: integer
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Templates
      summary: Create Template
      description: Create a new JSON transformation template
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
            examples:
              mentorTemplate:
                value:
                  code: mentorTemplate
                  name: Mentor Profile Template
                  description: Transforms internal mentor data to BECKN DSEP format
                  version: 1.0.0
                  template_object:
                    person:
                      id: '{{mentor.user_id}}'
                      name: '{{mentor.name}}'
                      image:
                        url: '{{mentor.image}}'
                      gender: '{{mentor.gender}}'
                    rating: '{{mentor.rating.average}}'
                  is_active: true
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Template code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/templates/{id}:
    get:
      tags:
        - Templates
      summary: Get Template
      description: Retrieve a specific template by ID
      operationId: getTemplate
      parameters:
        - $ref: '#/components/parameters/templateId'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Templates
      summary: Update Template
      description: Update an existing template
      operationId: updateTemplate
      parameters:
        - $ref: '#/components/parameters/templateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Template'
      responses:
        '200':
          description: Template updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Templates
      summary: Delete Template
      description: Soft delete a template by setting is_active to false
      operationId: deleteTemplate
      parameters:
        - $ref: '#/components/parameters/templateId'
      responses:
        '200':
          description: Template deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/templates/{id}/test:
    post:
      tags:
        - Templates
      summary: Test Template
      description: Test a template with sample data
      operationId: testTemplate
      parameters:
        - $ref: '#/components/parameters/templateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input_data:
                  type: object
                  description: Sample input data to test the template
      responses:
        '200':
          description: Template test successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  input:
                    type: object
                  output:
                    type: object
                  execution_time:
                    type: number
                    format: float
                    description: Template execution time in milliseconds
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Template not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
